<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/admin/style.css">
    <title>Tambah Film</title>
</head>
<body>
    <div>
        <h1>Tambah Film Baru</h1>
        <form action="/admin/tambah-film" method="post">
            <label for="film-name">Judul Film:</label>
            <input type="text" id="film-name" name="namaFilm" placeholder="Masukkan nama film" required>

            <label for="aktor">Aktor</label>
            <select name="aktor" id="aktor">
                <option th:each="aktor: ${aktors}"
                        th:value="${aktor.nama}"
                        th:text="${aktor.nama}">
                </option>
            </select>

            <label for="genre">Genre:</label>
            <select name="genre" id="genre">
                <option th:each="genre: ${genres}"
                        th:value="${genre.nama}"
                        th:text="${genre.nama}">
                </option>
            </select>

            <label for="poster">Poster Film:</label>
            <input type="file" id="poster" name="poster" accept="image/*" required><br><br>

            <button type="submit" class="btn">Tambah Film</button>
        </form>
        <a href="dashboard.html" class="back-btn">Kembali ke Dashboard</a>
    </div>
</body>
</html>
