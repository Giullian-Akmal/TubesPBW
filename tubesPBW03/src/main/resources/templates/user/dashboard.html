<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Member</title>
    
</head>
<link rel="stylesheet" href="/user/dashboard.css">

<body>
    <div class="flex">
        <!-- Sidebar -->
        <aside>
            <h2>Member Menu</h2>
            <nav>
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="pinjam.html">Pinjam</a></li>
                    <li><a href="histori.html">Lihat Histori Peminjaman</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main>
            <header>
                <div>
                    <h1>Selamat datang di Rental12345.com</h1>
                    <p>Halo, User</p>
                    <input type="text" placeholder="genre/aktor/judul film">
                    <a id="search-btn" href="#">Search (TBA)</a>
                </div>
                <a id="logout-btn" href="login.html">Logout</a>
            </header>
            <div id="container">
                <h1>List Film</h1>
                <table>
                    <tr>
                        <th>Film</th>
                        <th>Judul Film</th>
                        <th>Genre</th>
                        <th>Aktor</th>
                    </tr>
                    <tr th:each="movie: ${movies}">
                        <td th:text="${movie.id}"></td>
                        <td th:text="${movie.nama}"></td>
                        <td th:text="${movie.aktor}"></td>
                        <td th:text="${movie.genre}"></td>
                    </tr>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
