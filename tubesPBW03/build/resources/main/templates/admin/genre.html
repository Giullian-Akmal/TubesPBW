<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/admin/table.css">
    <title>List Genre</title>
</head>
<body>
    <div id="container">
        <h1>List Genre</h1>
        <table>
            <tr>
                <th>Nama Genre</th>
            </tr>
            <tr th:each="genre: ${genres}">
                <td th:text="${genre.nama}"></td>
            </tr>
        </table>
        <a href="tambahgenre.html">Tambah Genre</a>
        <a href="dashboard.html">Kembali</a>
    </div>
</body>
</html>
